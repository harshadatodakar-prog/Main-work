<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="login-box">

<h2>Forgot Password</h2>

<form action="forgot_password.php"
method="POST">

<div class="input-box">

<i class="fa fa-phone"></i>

<input
type="text"
name="phone"
placeholder="Phone Number"
required>

</div>

<div class="input-box">

<i class="fa fa-key"></i>

<input
type="text"
name="otp"
placeholder="OTP"
required>

</div>

<button type="submit">

Verify OTP

</button>

<p>

Remember your password?

<a href="login.html">

Login

</a>

</p>

</form>

</div>

</body>

</html>
